name: profile charts

on:
  schedule:
    - cron: "15 15 * * *" # 毎日 0:15 (JST)
  workflow_dispatch:
  push:
    paths: ["profile_config.yml", "profile_charts.py"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib numpy requests pyyaml
      - run: python profile_charts.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_EMAILS: ${{ secrets.MY_EMAILS }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Update profile charts"
          git pull --rebase
          git push
